<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | Teksun</title>

<link rel="stylesheet" href="css/style.css">


<style>

.checkout-product{

    display:flex;
    align-items:center;
    gap:25px;
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;

}



.checkout-product img{

    width:120px;
    height:120px;
    object-fit:contain;
    border-radius:15px;

}



.checkout-info{

    flex:1;

}



.checkout-info h3{

    margin-bottom:10px;

}



.checkout-info p{

    font-size:18px;
    font-weight:bold;

}



.checkout-info span{

    display:inline-block;
    margin-top:10px;
    background:#FFC21A;
    color:#0B2348;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;

}



.order-title{

    margin-bottom:20px;

}



.order-title h3{

    margin-bottom:5px;

}



.order-title p{

    color:#555;

}



.checkout-features{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;

}



.checkout-features div{

    background:#f8fafc;
    padding:15px;
    text-align:center;
    border-radius:15px;
    font-size:14px;

}



@media(max-width:768px){


.checkout-product{

    flex-direction:column;
    text-align:center;

}



.checkout-product img{

    width:150px;
    height:150px;

}



.checkout-features{

    grid-template-columns:1fr;

}


}


</style>


</head>



<body>



<header>

<div class="container header-content">

<div class="logo">

<img src="images/Picsart_26-08-02_20-04-55-030.jpg" alt="Teksun">

</div>

</div>

</header>





<section class="checkout">


<div class="container">


<h2 class="section-title">

تکمیل سفارش

</h2>




<div class="checkout-box">





<div class="checkout-product">


<img id="product-image" 
src="images/product-20w.jpg" 
alt="محصول">



<div class="checkout-info">


<h3 id="product-name">

محصول انتخابی

</h3>



<p id="product-price">

قیمت محصول

</p>



<span>

✔ موجود در انبار

</span>


</div>



</div>








<div class="order-title">


<h3>

اطلاعات ارسال

</h3>


<p>

لطفاً اطلاعات خود را برای ثبت سفارش وارد کنید.

</p>


</div>







<form id="order-form">


<input 
id="fullname"
type="text" 
placeholder="نام و نام خانوادگی"
required>



<input 
id="phone"
type="tel" 
placeholder="شماره تماس"
required>



<textarea 
id="address"
placeholder="آدرس کامل"
rows="4"
required></textarea>



<input 
id="postal"
type="text" 
placeholder="کد پستی"
required>



<button class="btn" type="submit">

پرداخت و ثبت سفارش

</button>


</form>
<div class="checkout-features">


<div>

🔒

<br>

پرداخت امن

</div>



<div>

🚚

<br>

ارسال سریع

</div>



<div>

☀️

<br>

محصول اصلی Teksun

</div>



</div>





</div>


</div>


</section>







<footer>


<p>

© 2026 Teksun - تمامی حقوق محفوظ است.

</p>


</footer>









<script>


const products = {


"20w": {

name:"شارژر خورشیدی تاشو ۲۰ وات",

price:"5,490,000 تومان",

image:"images/product-20w.jpg"

},



"40w": {

name:"شارژر خورشیدی تاشو ۴۰ وات",

price:"8,240,000 تومان",

image:"images/product-40w.jpg"

},



"60w": {

name:"شارژر خورشیدی تاشو ۶۰ وات",

price:"10,980,000 تومان",

image:"images/product-60w.jpg"

}


};





const params = new URLSearchParams(window.location.search);


const selectedProduct = params.get("product");





if(products[selectedProduct]){


document.getElementById("product-name").innerHTML =
products[selectedProduct].name;



document.getElementById("product-price").innerHTML =
"قیمت: " + products[selectedProduct].price;



document.getElementById("product-image").src =
products[selectedProduct].image;


}







// اعتبارسنجی فرم سفارش


const form = document.getElementById("order-form");



form.addEventListener("submit", function(e){


e.preventDefault();



const fullname = document.getElementById("fullname").value.trim();

const phone = document.getElementById("phone").value.trim();

const address = document.getElementById("address").value.trim();

const postal = document.getElementById("postal").value.trim();





if(fullname.length < 3){


alert("لطفاً نام و نام خانوادگی صحیح وارد کنید");


return;


}





const phoneRegex = /^09[0-9]{9}$/;



if(!phoneRegex.test(phone)){


alert("شماره تماس باید ۱۱ رقم باشد و با 09 شروع شود");


return;


}






if(address.length < 10){


alert("لطفاً آدرس کامل وارد کنید");


return;


}






const postalRegex = /^[0-9]{10}$/;



if(!postalRegex.test(postal)){


alert("کد پستی باید ۱۰ رقم باشد");


return;


}





alert("اطلاعات با موفقیت تایید شد. آماده اتصال به پرداخت هستیم.");



});



</script>





</body>

</html>
